name: dev-runtime

on:
  push:
    branches: ['dev-external-source']
    paths:
      - '.github/workflows/dev-runtime.yml'
      - 'requirements.txt'
      - 'main.py'
      - 'DEV使用说明.md'
      - 'app/**'
      - 'core/**'
      - 'vendor/**'
      - 'tests/**'
      - 'dev/DevBootstrap.py'
      - 'dev/dev.spec'
      - 'dev/DevUpdater.cs'
      - 'dev/runtime-sync.txt'
      - 'dev/runtime-generation.txt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 安装运行依赖
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pytest

      - name: 运行全部回归测试
        shell: pwsh
        run: |
          python -m pytest tests -q

      - name: 校验 V2 运行时同步清单
        shell: pwsh
        run: |
          if (-not (Test-Path 'dev\runtime-sync.txt')) { throw '缺少 runtime-sync.txt' }
          if (-not (Test-Path 'dev\runtime-generation.txt')) { throw '缺少 runtime-generation.txt' }
          $required = Get-Content 'dev\runtime-sync.txt' | Where-Object { $_ -like 'required=*' }
          foreach ($line in $required) {
            $path = $line.Substring(9).Replace('/', '\')
            if (-not (Test-Path $path)) { throw "同步清单 required 不存在：$path" }
          }

      - name: 构建精简开发运行时
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean dev/dev.spec

      - name: 构建 V2 图形源码更新器
        shell: pwsh
        run: |
          $candidates = @(
            "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe",
            "$env:WINDIR\Microsoft.NET\Framework\v4.0.30319\csc.exe"
          )
          $csc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $csc) { throw '找不到 Windows Framework C# 编译器' }
          & $csc /nologo /target:winexe /optimize+ /out:'dev\更新开发源码.exe' /reference:System.Windows.Forms.dll /reference:System.Drawing.dll /reference:System.IO.Compression.dll /reference:System.IO.Compression.FileSystem.dll 'dev\DevUpdater.cs'
          if ($LASTEXITCODE -ne 0) { throw 'V2 图形源码更新器编译失败' }

      - name: 组装开发环境
        shell: pwsh
        run: |
          $out = Join-Path $PWD 'dist\JevChat-Windows-Dev'
          if (-not (Test-Path $out)) { throw '没有生成开发运行时目录' }

          Copy-Item 'main.py' $out -Force
          Copy-Item 'app' $out -Recurse -Force
          Copy-Item 'core' $out -Recurse -Force
          Copy-Item 'vendor' $out -Recurse -Force
          Copy-Item 'requirements.txt','LICENSE','NOTICE','DEV使用说明.md' $out -Force
          Copy-Item 'dev\runtime-generation.txt' (Join-Path $out 'runtime-generation.txt') -Force
          Copy-Item 'dev\runtime-sync.txt' (Join-Path $out 'runtime-sync.txt') -Force
          Copy-Item 'dev\更新开发源码.exe' $out -Force

          $size = (Get-ChildItem $out -Recurse -File | Measure-Object Length -Sum).Sum
          Write-Host ("开发环境展开大小：{0:N1} MB" -f ($size / 1MB))

      - name: 上传开发环境
        uses: actions/upload-artifact@v4
        with:
          name: JevChat-Windows-Dev
          path: dist/JevChat-Windows-Dev/*
          if-no-files-found: error
